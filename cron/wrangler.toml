# 独立定时触发器 Worker 配置（Pages 无原生 Cron Triggers 的替代方案）
# 部署：wrangler deploy -c cron/wrangler.toml
name = "tanzhen-cron"
main = "worker.js"
compatibility_date = "2026-06-05"

[vars]
# ⚠️ 请按实际 Pages 域名修改（Pages 部署后 Cloudflare 会分配 <项目名>.pages.dev 域名，也可绑定自定义域名）
# 该 SITE_URL 也可改在 Dashboard 该 Worker 的变量中配置，届时以 Dashboard 为准（本文件仅作本地兜底）。
SITE_URL = "https://tanzhen.pages.dev"

# ⚠️ 还需要配置与 Pages 端完全一致的 API_SECRET，否则 /api/cron 会返回 403 Forbidden。
# 推荐使用 Secret 方式（不要把密钥写进本文件提交到仓库）：
#   wrangler secret put API_SECRET -c cron/wrangler.toml

# 每分钟触发一次，与改造前 wrangler.toml 中的 [triggers] 保持一致
[triggers]
crons = ["*/1 * * * *"]
