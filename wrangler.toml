# Cloudflare Pages 项目配置
# ==============================================================================
# 职责说明：本文件仅用于【本地开发】（wrangler pages dev）与【项目标识】。
# 生产环境的绑定、变量与密钥统一在 Cloudflare Dashboard 管理，本文件一概不持有。
# ==============================================================================
#
# 【D1 绑定点位】
#   Workers & Pages → 选择本项目 → Settings → Bindings → D1 database
#   ⚠️ 绑定变量名必须为 DB（与代码中的 env.DB 对应）
#
# 【环境变量与密钥点位】
#   Workers & Pages → 选择本项目 → Settings → Variables and Secrets（如 API_SECRET）
#
# 【构建配置点位】
#   本文件刻意不含 pages_build_output_dir，Cloudflare 会将其视为仅本地开发用，
#   不作为 Pages 生产配置来源。构建命令与输出目录请在 Dashboard 的
#   Build configuration 中设置：
#       Build command          = node scripts/build.js
#       Build output directory = dist
#
# 【本地开发需要 D1 时】用命令行传参：
#   npx wrangler pages dev dist --d1=DB
#
# 注意：Pages 不支持 Cron Triggers，定时告警由 cron/ 目录下的独立 Worker 承担。

name = "tanzhen"
compatibility_date = "2026-06-05"
