# Cloudflare Workers 项目配置（回退旧部署方式时使用的兼容配置）
# ==============================================================================
# 用途：仅当需要回退到 Workers 部署时使用
#   npx wrangler deploy -c wrangler.workers.toml   （或 npm run deploy:workers）
# ==============================================================================
#
# 【D1 绑定（变量名必须为 DB）】与【API_SECRET】请在 Dashboard 配置：
#   Workers & Pages → 选择该 Worker 项目 → Settings → Bindings（D1 database，变量名填 DB）
#   Workers & Pages → 选择该 Worker 项目 → Settings → Variables and Secrets（API_SECRET）
#
# ⚠️ 由于本文件不再声明 [[d1_databases]]，执行 wrangler deploy 后请到 Dashboard
#    确认 DB 绑定仍然存在，否则运行时将缺少 env.DB。

name = "tanzhen"
main = "src/index.js"
compatibility_date = "2026-06-05"

# 掉线告警定时扫描：全部节点掉线时没有上报流量触发检查，靠 Cron 保证告警可达
[triggers]
crons = ["*/1 * * * *"]
